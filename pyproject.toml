[project]
name = "claimcheck"
version = "0.1.0"
description = "Finds claims in docstrings/comments/markdown that the code contradicts."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
claimcheck = "claimcheck.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-randomly>=3.15",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG",
    "PTH", "ERA", "PL", "TRY", "BLE", "FBT", "T20", "PGH", "S", "C90",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# scripts/check_exceptions.py is a standalone CLI check, not library code —
# printing its findings to stdout is the entire point (T201).
"scripts/*.py" = ["T201"]
# tests/fixtures/sample_repo is claim-extraction test data, not shipped code:
# its exception messages are deliberately inline prose the extractor reads,
# not something worth a named exception subclass (TRY003).
"tests/fixtures/**/*.py" = ["TRY003"]

[tool.mypy]
files = ["src", "scripts", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/claimcheck"]

[tool.coverage.report]
fail_under = 80
