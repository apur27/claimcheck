[project]
name = "claimcheck"
version = "0.1.0"
description = "Finds claims in docstrings/comments/markdown that the code contradicts."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2",
    "python-dotenv>=1.2",
]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-randomly>=3.15",
    "import-linter>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ARG",
    "PTH", "ERA", "PL", "TRY", "BLE", "FBT", "T20", "PGH", "S", "C90",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# scripts/check_exceptions.py is a standalone CLI check, not library code —
# printing its findings to stdout is the entire point (T201).
"scripts/*.py" = ["T201"]
# src/claimcheck/cli is the documented entry point (`claimcheck src/`) —
# printing findings to the terminal is its whole job (T201). `--diff` shells
# out to `git` with a fixed argument list, cwd pinned to a resolved repo
# path, no shell=True and no string interpolation into the command --
# S603/S607 flag any subprocess.run call and any bare "git" lookup on
# principle, but there is no untrusted input reaching the shell here.
"src/claimcheck/cli/*.py" = ["T201", "S603", "S607"]
# tests/fixtures/sample_repo is claim-extraction test data, not shipped code:
# its exception messages are deliberately inline prose the extractor reads,
# not something worth a named exception subclass (TRY003).
"tests/fixtures/**/*.py" = ["TRY003"]
# test_cli.py drives real `git` commands against tmp_path fixtures to prove
# --diff's staged-file scoping; same fixed-argument-list, no-shell rationale
# as the cli module itself (S603/S607).
"tests/test_cli.py" = ["S603", "S607"]
# adapters/anthropic_client.py tracks and prints real dollar spend after every live model call,
# and the real SDK exception on any error -- an operator-facing cost/error signal this slice's
# brief requires, not incidental debug output (T201).
"src/claimcheck/adapters/anthropic_client.py" = ["T201"]

[tool.mypy]
files = ["src", "scripts", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/claimcheck"]

[tool.coverage.report]
fail_under = 80
